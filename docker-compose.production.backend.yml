# Production backend → ApsaraDB RDS (no local Postgres).
# Set DATABASE_URL in ./backend/.env to the VPC internal endpoint and the production database.
# Deploy this file on the production host only after staging sign-off.
# See docs/APSARADB-MIGRATION.md
#
# Until that cutover (or to roll back to local PG 16), merge the overlay:
#   docker compose -f docker-compose.production.backend.yml \
#     -f docker-compose.production.backend.local-postgres.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eos-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PORT: 3003
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-4h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-4h}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # PO PDF Claude: set in backend/.env (env_file above).
    ports:
      - "${BACKEND_PORT:-3003}:3003"
    volumes:
      # Host Synology path mounted into backend container.
      - ${STORAGE_HOST_MOUNT:-/mnt/synology/EXIM/Import}:/mnt/synology/EXIM/Import

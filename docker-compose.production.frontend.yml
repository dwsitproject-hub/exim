services:
  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
    container_name: eos-frontend-prod
    restart: unless-stopped
    env_file:
      - ./frontEnd/.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
      # Do not set BACKEND_INTERNAL_URL here. Compose would interpolate an empty
      # host var and wipe the value from ./frontEnd/.env.
    ports:
      - "${FRONTEND_PORT:-3020}:3000"

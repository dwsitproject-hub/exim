# Rollback / pre-cutover overlay: local PostgreSQL 16 for staging.
# Merge with docker-compose.staging.backend.yml — do not use after RDS cutover
# unless you are rolling back. Do not docker compose down -v (destroys the volume).
#
#   docker compose -f docker-compose.staging.backend.yml \
#     -f docker-compose.staging.backend.local-postgres.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: eos-postgres-staging
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5422:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
